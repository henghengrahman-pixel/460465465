services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: staffmonitor
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  app:
    build: .
    depends_on: [db]
    environment:
      PORT: 8080
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@db:5432/staffmonitor
      JWT_SECRET: local-dev-secret-change-this-1234567890
      DEVICE_ENROLL_SECRET: local-enroll-secret
      ADMIN_ID: admin
      ADMIN_PASSWORD: ChangeMe123!
      APP_URL: http://localhost:8080
    ports: ["8080:8080"]
volumes:
  pgdata:
